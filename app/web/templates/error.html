{% extends 'base.html' %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card" style="max-width:680px">
  <div style="font-size:42px;font-weight:700;color:#d94a4a;line-height:1">{{ code }}</div>
  <p style="font-size:14px;line-height:2;color:#4a6075;margin-top:14px">{{ message }}</p>
  <div style="margin-top:16px;display:flex;gap:10px">
    <a class="btn btn-primary" href="/">Return to Dashboard</a>
    <button class="btn" onclick="history.back()">Go Back</button>
  </div>
</div>
{% endblock %}
