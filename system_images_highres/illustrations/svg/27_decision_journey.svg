<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated colonoscopy screening decision journey</title>
  <desc id="desc">Risk awareness, cognitive editing, value weighting, screening intention and screening action connected by a moving signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset=".55" stop-color="#eef8f7"/>
      <stop offset="1" stop-color="#fff8eb"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1668b3"/>
      <stop offset=".5" stop-color="#12a594"/>
      <stop offset="1" stop-color="#c8973f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#12a594" stop-opacity=".28"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14304d" flood-opacity=".12"/>
    </filter>
    <style>
      .label{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14304d}
      .sub{font:600 13.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#718399}
      .node-card{fill:#fff;stroke:#dce8f2;stroke-width:1.2}
      .pulse{transform-origin:center;animation:pulse 2.8s ease-out infinite}
      .pulse.d2{animation-delay:.55s}.pulse.d3{animation-delay:1.1s}.pulse.d4{animation-delay:1.65s}.pulse.d5{animation-delay:2.2s}
      .float{animation:floatGlow 4.5s ease-in-out infinite}
      .float.d2{animation-delay:.8s}.float.d3{animation-delay:1.6s}
      .bar{animation:bar 2.2s ease-in-out infinite alternate}
      .bar.d2{animation-delay:.4s}.bar.d3{animation-delay:.8s}
      @keyframes pulse{0%{r:27px;opacity:.62}70%{r:48px;opacity:0}100%{r:48px;opacity:0}}
      @keyframes floatGlow{0%,100%{opacity:.88}50%{opacity:1}}
      @keyframes bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="900" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".26" stroke="#b8d7e8" stroke-width="1">
    <path d="M0 70H900M0 140H900M0 210H900M0 280H900M0 350H900"/>
    <path d="M75 0V420M150 0V420M225 0V420M300 0V420M375 0V420M450 0V420M525 0V420M600 0V420M675 0V420M750 0V420M825 0V420"/>
  </g>
  <circle cx="790" cy="70" r="78" fill="url(#glow)"/>
  <circle cx="112" cy="350" r="95" fill="url(#glow)"/>

  <path id="journeyPath" d="M88 250 C175 286 210 225 288 226 S425 292 505 236 S635 105 810 148" fill="none" stroke="#cbdde9" stroke-width="12" stroke-linecap="round"/>
  <path d="M88 250 C175 286 210 225 288 226 S425 292 505 236 S635 105 810 148" fill="none" stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 13">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="5s" repeatCount="indefinite"/>
  </path>

  <g class="float" transform="translate(46 156)">
    <rect width="126" height="82" rx="18" class="node-card" filter="url(#softShadow)"/>
    <circle cx="26" cy="37" r="16" fill="#e8f1fb"/>
    <path d="M20 37h12M26 31v12" stroke="#1668b3" stroke-width="2.4" stroke-linecap="round"/>
    <text x="22" y="66" class="label">Risk profile</text>
    <text x="22" y="80" class="sub">Baseline + context</text>
  </g>

  <g class="float d2" transform="translate(260 132)">
    <rect width="136" height="82" rx="18" class="node-card" filter="url(#softShadow)"/>
    <circle cx="28" cy="37" r="16" fill="#eef9f7"/>
    <path d="M20 43l7-9 6 5 8-10" fill="none" stroke="#12a594" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="66" class="label">Mental editing</text>
    <text x="22" y="80" class="sub">Framing + heuristics</text>
  </g>

  <g class="float d3" transform="translate(476 214)">
    <rect width="136" height="82" rx="18" class="node-card" filter="url(#softShadow)"/>
    <circle cx="28" cy="37" r="16" fill="#fff7e8"/>
    <path d="M19 42h18M22 36l6-8 6 8" fill="none" stroke="#c8973f" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="66" class="label">Value + weight</text>
    <text x="22" y="80" class="sub">Gain/loss reference</text>
  </g>

  <g class="float" transform="translate(658 82)">
    <rect width="150" height="86" rx="18" class="node-card" filter="url(#softShadow)"/>
    <circle cx="29" cy="39" r="16" fill="#edf3ff"/>
    <path d="M21 39h16M29 31v16" stroke="#5f72c8" stroke-width="2.3" stroke-linecap="round"/>
    <text x="22" y="69" class="label">Intention</text>
    <text x="22" y="83" class="sub">Decision readiness</text>
  </g>

  <g transform="translate(747 274)">
    <circle cx="66" cy="32" r="25" fill="#12a594"/>
    <circle class="pulse d5" cx="66" cy="32" r="27" fill="none" stroke="#12a594" stroke-width="2"/>
    <path d="M56 32l7 7 14-16" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="78" class="label">Screening action</text>
    <text x="0" y="93" class="sub">Colonoscopy participation</text>
  </g>

  <g transform="translate(132 263)">
    <circle class="pulse" cx="0" cy="0" r="27" fill="none" stroke="#1668b3" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#1668b3"/>
  </g>
  <g transform="translate(327 178)">
    <circle class="pulse d2" cx="0" cy="0" r="27" fill="none" stroke="#12a594" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#12a594"/>
  </g>
  <g transform="translate(544 262)">
    <circle class="pulse d3" cx="0" cy="0" r="27" fill="none" stroke="#c8973f" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#c8973f"/>
  </g>
  <g transform="translate(731 124)">
    <circle class="pulse d4" cx="0" cy="0" r="27" fill="none" stroke="#5f72c8" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#5f72c8"/>
  </g>

  <circle r="6" fill="#12a594">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#journeyPath"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#c8973f">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" rotate="auto"><mpath href="#journeyPath"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(92 72)">
    <rect width="248" height="66" rx="16" fill="#14304d" filter="url(#softShadow)"/>
    <text x="18" y="26" fill="#9de4da" font-size="13" font-weight="800" letter-spacing="1.2">LIVE DECISION SIGNAL</text>
    <g transform="translate(19 44)">
      <rect width="12" height="14" rx="3" fill="#2a9bd5" class="bar"/>
      <rect x="17" width="12" height="14" rx="3" fill="#12a594" class="bar d2"/>
      <rect x="34" width="12" height="14" rx="3" fill="#e5b455" class="bar d3"/>
      <text x="58" y="12" fill="#dce9f3" font-size="12.5" font-weight="600">Preferences update with context</text>
    </g>
  </g>
</svg>